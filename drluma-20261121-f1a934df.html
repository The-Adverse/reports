<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>د. لمى · التقرير الأسبوعي للإعلانات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f6f7f9;--surface:#fff;--ink:#12151c;--ink2:#4b5160;--muted:#7a8091;--line:#e3e6ec;
  --before:#a9aebb;--after:#2a78d6;--accent:#2a78d6;--accent-soft:#e8f0fc;--brand:#f26b21;
  --good:#0b7a3f;--good-bg:#e4f5ea;--bad:#b4261f;--bad-bg:#fdebe9;--neu:#4b5160;--neu-bg:#eceef2;
  --display:'Cairo',system-ui,sans-serif;--body:'Cairo',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#0e1118;--surface:#171b24;--ink:#eef0f5;--ink2:#b9beca;--muted:#8a90a0;--line:#2a3040;
  --before:#6b7183;--after:#3987e5;--accent:#3987e5;--accent-soft:#16253b;
  --good:#52d189;--good-bg:#12301f;--bad:#ff8f87;--bad-bg:#3a1917;--neu:#b9beca;--neu-bg:#252a37;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.deck{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;height:100%;scroll-snap-align:start;overflow-y:auto;padding:28px 20px 110px}
.inner{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand img{width:40px;height:40px;display:block}
.brand span{font-family:var(--display);font-weight:700;font-size:15px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:700}
h1,h2{font-family:var(--display);margin:6px 0 8px;text-wrap:balance}
h2{font-size:clamp(24px,5vw,32px);line-height:1.15}
.lead{color:var(--ink2);margin:0 0 20px;max-width:60ch}

/* welcome */
.welcome{display:flex;flex-direction:column;justify-content:center;min-height:calc(100% - 40px);text-align:center;align-items:center}
.welcome img{width:96px;height:96px;margin-bottom:28px}
.welcome .hi{font-size:18px;color:var(--muted);font-weight:600}
.welcome h1{font-size:clamp(34px,8vw,56px);line-height:1.05;margin:10px 0 14px}
.welcome .ready{font-size:clamp(17px,3.6vw,20px);color:var(--ink2);margin:0 0 22px}
.range{display:inline-flex;flex-direction:column;gap:4px;padding:16px 24px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.range b{font-family:var(--display);font-size:clamp(20px,4.6vw,26px)}
.range small{color:var(--muted);font-size:13px}
.start{margin-top:30px;font:700 15px var(--body);color:#fff;background:var(--accent);border:0;border-radius:999px;padding:14px 28px;cursor:pointer}
.start:focus-visible,.nav button:focus-visible,.ad a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* cards */
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink2);margin-bottom:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
@media (max-width:480px){.card{padding:12px 13px 10px}.card .val{font-size:22px}.card.hero .val{font-size:38px}.card:not(.hero) svg{display:none}.page{padding:20px 14px 100px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px 12px;display:flex;flex-direction:column;gap:6px}
.card.hero{grid-column:1/-1}
.card .lab{font-size:13px;color:var(--muted);font-weight:700}
.card .val{font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.card.hero .val{font-size:44px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.neu{background:var(--neu-bg);color:var(--neu)}
.was{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;direction:ltr}
svg text{font-family:var(--body);font-size:12px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}
.note{margin-top:14px;font-size:13px;color:var(--ink2);background:var(--neu-bg);border-radius:12px;padding:10px 14px}

/* ads */
.ads{display:grid;gap:12px}
.ad{display:grid;grid-template-columns:44px 1fr;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.ad .rk{grid-row:span 3;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 18px var(--display)}
.ad .rk.first{background:var(--brand);color:#fff}
.ad .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.ad .st{font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ad .st b{color:var(--ink);font-size:16px}
.ad a{font-size:14px;font-weight:700;color:var(--accent);text-decoration:none;width:fit-content}
.ad a:hover{text-decoration:underline}
.ad .nolink{font-size:12.5px;color:var(--muted)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;color:var(--ink2)}
.thanks{margin-top:26px;text-align:center;color:var(--muted);font-size:13px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent)}
.nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:8px}
.dots span{width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .2s,background .2s;cursor:pointer}
.dots span.on{width:24px;background:var(--accent)}
@media (prefers-reduced-motion:reduce){.deck{scroll-behavior:auto}.dots span{transition:none}}
</style>
</head>
<body>
<main class="deck" id="deck" aria-label="التقرير الأسبوعي"></main>
<nav class="nav" aria-label="الصفحات">
  <button id="prev" aria-label="الصفحة السابقة">→</button>
  <div class="dots" id="dots"></div>
  <button id="next" aria-label="الصفحة التالية">←</button>
</nav>

const C={"name":"د. لمى","note":null,"prev":{"spend":69.95,"reach":24940,"imp":48129,"views":48073,"ctr":3.45,"eng":11517,"msgs":112},"cur":{"spend":69.97,"reach":27671,"imp":49909,"views":50348,"ctr":3.14,"eng":10994,"msgs":132},"ads":[{"n":"Video ad 26","m":109,"c":0.49,"u":null},{"n":"Video ad 1","m":23,"c":0.7,"u":null}],"curLabel":"15–21 تشرين الثاني","prevLabel":"8–14 تشرين الثاني","curLong":"15 – 21 تشرين الثاني 2026","compare":"مقارنةً بأسبوع 8 – 14 تشرين الثاني 2026"};
const fN=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
const f1=n=>n==null?'—':n.toFixed(1);
const fM=n=>n==null?'—':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fP=n=>n==null?'—':n.toFixed(2)+'%';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const M={
 msgs:{label:'الرسائل',better:1,f:fN,get:p=>p.msgs},
 daily:{label:'معدل الرسائل اليومي',better:1,f:f1,get:p=>p.msgs/7},
 spend:{label:'المصروف',better:0,f:fM,get:p=>p.spend},
 cpm:{label:'تكلفة الرسالة الواحدة',better:-1,f:fM,get:p=>p.msgs>0&&p.spend>0?p.spend/p.msgs:null},
 reach:{label:'الوصول',better:1,f:fN,get:p=>p.reach},
 imp:{label:'مرات الظهور',better:1,f:fN,get:p=>p.imp},
 views:{label:'المشاهدات',better:1,f:fN,get:p=>p.views},
 ctr:{label:'نسبة النقر (CTR)',better:1,f:fP,get:p=>p.ctr},
 eng:{label:'التفاعل',better:1,f:fN,get:p=>p.eng}
};
const val=(m,p)=>p?m.get(p):null;
function delta(m,c,p){
  if(c==null||p==null) return {t:p==null&&c!=null?'جديد':'—',c:'neu'};
  if(p===0) return {t:c>0?'جديد':'—',c:'neu'};
  const pc=(c-p)/p*100,d=Math.abs(pc)<0.05?0:(pc>0?1:-1),a=Math.abs(pc);
  const s=(a<10?a.toFixed(1):Math.round(a))+'%';
  return {t:d===0?'بدون تغيير':(d>0?'▲ +':'▼ −')+s,c:d===0||m.better===0?'neu':(d*m.better>0?'good':'bad')};
}
function bars(pv,cv,f){
  const max=Math.max(1e-9,pv||0,cv||0),W=300,iw=230,bh=10;
  let s=`<svg viewBox="0 0 ${W} 30" role="img" aria-label="السابق ${pv==null?'لا توجد بيانات':f(pv)}، الحالي ${f(cv)}">`;
  [[pv,'var(--before)',2],[cv,'var(--after)',16]].forEach(([v,col,y])=>{
    const w=v==null?0:Math.max(v>0?3:0,v/max*iw);
    s+=`<rect x="${W-w}" y="${y}" width="${w}" height="${bh}" rx="3" fill="${col}"/><text x="${W-w-6}" y="${y+bh-1}" text-anchor="end">${v==null?'—':f(v)}</text>`;
  });
  return s+'</svg>';
}
function card(k,hero){
  const m=M[k],cv=val(m,C.cur),pv=val(m,C.prev),d=delta(m,cv,pv);
  return `<div class="card${hero?' hero':''}"><div class="lab">${m.label}</div><div class="val"><bdi dir="ltr">${m.f(cv)}</bdi></div>
  <div class="row"><span class="pill ${d.c}" dir="ltr">${d.t}</span><span class="was">كان <bdi dir="ltr">${pv==null?'—':m.f(pv)}</bdi></span></div>${bars(pv,cv,m.f)}</div>`;
}
const legend=`<div class="legend"><span><i style="background:var(--before)"></i>الأسبوع السابق · ${C.prevLabel}</span><span><i style="background:var(--after)"></i>هذا الأسبوع · ${C.curLabel}</span></div>`;
const brand=`<div class="brand"><img src="${LOGO}" alt=""><span dir="ltr">The Adverse</span></div>`;
const noteHtml=C.note?`<div class="note">${esc(C.note)}</div>`:'';

const pages=[];
pages.push(`<div class="inner welcome">
  <img src="${LOGO}" alt="شعار The Adverse">
  <div class="hi">أهلاً وسهلاً بكم</div>
  <h1>${esc(C.name)}</h1>
  <p class="ready">تقريركم الأسبوعي للإعلانات جاهز</p>
  <div class="range"><b>${C.curLong}</b><small>${C.compare}</small></div>
  <button class="start" data-go="1">عرض التقرير ←</button>
</div>`);
pages.push(`<div class="inner">${brand}<div class="eyebrow">١ · الرسائل</div><h2>المحادثات القادمة من إعلاناتكم</h2>
  <p class="lead">عدد المحادثات الجديدة التي بدأها الأشخاص معكم من خلال الإعلانات.</p>${legend}
  <div class="grid">${card('msgs',true)}${card('daily')}${card('spend')}${card('cpm')}</div>${noteHtml}</div>`);
pages.push(`<div class="inner">${brand}<div class="eyebrow">٢ · الوصول والتفاعل</div><h2>كم شخصاً شاهد إعلاناتكم وتفاعل معها</h2>
  <p class="lead">الوصول هو عدد الأشخاص المختلفين، ومرات الظهور هي كل مرة ظهر فيها الإعلان.</p>${legend}
  <div class="grid">${card('reach',true)}${card('imp')}${card('views')}${card('ctr')}${card('eng')}</div></div>`);
const safe=u=>/^https:\/\//.test(u||'');
const adsHtml=C.ads&&C.ads.length?`<div class="ads">${C.ads.map((a,i)=>`<div class="ad"><span class="rk${i===0?' first':''}">${i+1}</span>
  <span class="nm">${esc(a.n)}</span><span class="st"><b>${fN(a.m)}</b> رسالة · <bdi dir="ltr">${fM(a.c)}</bdi> للرسالة</span>
  ${safe(a.u)?`<a href="${esc(a.u)}" target="_blank" rel="noopener">مشاهدة على إنستغرام ↗</a>`:'<span class="nolink">رابط إنستغرام غير متوفر</span>'}</div>`).join('')}</div>`
  :`<div class="empty">لم تعمل أي إعلانات خلال هذا الأسبوع.</div>`;
pages.push(`<div class="inner">${brand}<div class="eyebrow">٣ · أفضل الإعلانات</div><h2>أفضل إعلاناتكم أداءً هذا الأسبوع</h2>
  <p class="lead">مرتبة حسب عدد الرسائل، ${C.curLabel}.</p>${adsHtml}
  <p class="thanks">أعدّه فريق The Adverse · النتائج المدفوعة من إعلانات ميتا بالدولار الأمريكي، ولا تشمل الرسائل الطبيعية.</p></div>`);

const deck=document.getElementById('deck'),dots=document.getElementById('dots');
deck.innerHTML=pages.map((p,i)=>`<section class="page" aria-label="الصفحة ${i+1} من ${pages.length}">${p}</section>`).join('');
dots.innerHTML=pages.map((_,i)=>`<span data-go="${i}" role="button" aria-label="الانتقال إلى الصفحة ${i+1}"></span>`).join('');
let cur=0;
const go=i=>{i=Math.max(0,Math.min(pages.length-1,i));deck.scrollTo({left:-i*deck.clientWidth});};
function sync(){cur=Math.round(Math.abs(deck.scrollLeft)/deck.clientWidth);
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
  document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===pages.length-1;}
deck.addEventListener('scroll',()=>requestAnimationFrame(sync));
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t)go(+t.dataset.go);});
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur+1);if(e.key==='ArrowRight')go(cur-1);});
addEventListener('resize',()=>go(cur));
sync();
</script>
